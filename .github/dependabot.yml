# Dependabot: revisa dependencias npm cada semana.
# Las versiones grandes del SDK de Expo se actualizan a mano con `npx expo install`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
